# Render Infrastructure-as-Code Blueprint
# Deploy this entire project to Render with 1-click by selecting "Blueprints" in Render.
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. BMTC JSON Database API
  - type: web
    name: bmtc-api
    runtime: node
    plan: free
    region: oregon
    rootDir: db
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromStaticSite:
          name: bmtc-user-app
          property: url
      - key: ADMIN_URL
        fromStaticSite:
          name: bmtc-admin-dashboard
          property: url

  # 2. BMTC Passenger Web App (Vite React)
  - type: web
    name: bmtc-user-app
    runtime: static
    plan: free
    rootDir: user-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bmtc-api
          property: url

  # 3. BMTC Admin Control Dashboard (Vite React)
  - type: web
    name: bmtc-admin-dashboard
    runtime: static
    plan: free
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bmtc-api
          property: url
      - key: VITE_ROBOFLOW_API_KEY
        value: zVvLiWzoQ9tohiNzcgBR
